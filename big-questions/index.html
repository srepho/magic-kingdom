<style>
  body { overflow: auto; }
  main { min-height: 100%; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 16px; padding: 20px; }
  h1 { width: 100%; text-align: center; margin: 0; font-size: clamp(26px, 5vw, 44px); font-weight: 800; }
  .book { width: min(44vw, 230px); display: grid; align-content: start; gap: 8px; padding: 10px 10px 12px; border-radius: 22px;
          border: 4px solid var(--ink); background: #fff; color: var(--ink); text-decoration: none;
          font-size: clamp(15px, 2.4vw, 19px); font-weight: 700; text-align: center; }
  .book:active { transform: scale(.97); }
  .book svg { width: 100%; border-radius: 14px; background: var(--sky); }
  /* covers keep still on the shelf except for one gentle bob */
  .book svg .ambient { animation: shelf-bob 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .book:nth-child(2n) svg .ambient { animation-delay: -1.7s; }
  @keyframes shelf-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
</style>
