<title>Big Questions</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  body { overflow: auto; }
  main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 44px); font-weight: 800; }
  .book { width: min(78vw, 360px); display: grid; gap: 10px; padding: 14px 14px 16px; border-radius: 26px;
          border: 4px solid var(--ink); background: #fff; color: var(--ink); text-decoration: none;
          font-size: clamp(18px, 3vw, 24px); font-weight: 700; text-align: center; }
  .book:active { transform: scale(.97); }
  .book svg { width: 100%; border-radius: 16px; background: var(--sky); }
  .cube { transform-origin: 150px 120px; animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(6deg); } 50% { transform: translateY(7px) rotate(-3deg); } }
</style>
</head>

<main>
  <h1>Big Questions</h1>
  <!-- the shelf: one animated cover per guide -->
  <a class="book" href="guides/01-made-of/index.html">
    <svg viewBox="0 30 300 190" role="img" aria-label="A glass of cordial with an ice cube">
      <ellipse cx="60" cy="56" rx="38" ry="12" fill="#fff"/><ellipse cx="236" cy="80" rx="44" ry="13" fill="#fff"/>

      <path d="M98 100 L106 196 Q107 204 116 204 L184 204 Q193 204 194 196 L202 100 Z" fill="#ffb3a1"/>
      <g class="cube ambient">
        <rect x="124" y="84" width="52" height="52" rx="14" fill="#eaf7ff" stroke="#9cc9e6" stroke-width="3"/>
        <path d="M134 98h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path d="M98 100 L106 196 Q107 204 116 204 L184 204 Q193 204 194 196 L202 100 Z" fill="#ffb3a1" opacity=".35"/>
      <path d="M88 52 L106 196 Q107 204 116 204 L184 204 Q193 204 194 196 L212 52" fill="none" stroke="#7b8a93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    What is everything made of?
  </a>
</main>
