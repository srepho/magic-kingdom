<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic Kingdom 🦄</title>
<style>
  :root{
    --sky1:#cdb4f7; --sky2:#ffc6e7; --sky3:#fff1c9;
    --candy-pink:#ff8fc8; --candy-purple:#b98fff; --candy-blue:#7fc4ff;
    --candy-mint:#7fe8c0; --candy-sun:#ffd66e; --candy-peach:#ffb199;
    --ink:#5a3d7a; --white:#fffdfa;
    --shadow:0 8px 0 rgba(90,61,122,.18);
    --font:'Baloo 2','Comic Sans MS','Chalkboard SE',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:var(--font);color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }

  /* ---------- drifting clouds & sparkle atmosphere ---------- */
  .cloud{position:fixed;font-size:9vmin;opacity:.8;filter:blur(.5px);pointer-events:none;z-index:0;
    animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
  .twinkle{position:fixed;pointer-events:none;z-index:0;font-size:3vmin;opacity:.6;
    animation:twinkleAnim 3s ease-in-out infinite;}
  @keyframes twinkleAnim{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.8;transform:scale(1.15)}}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:1;}
  .screen.active{display:flex;}

  /* ---------- shared chunky button ---------- */
  .btn{
    font-family:var(--font);font-weight:800;color:var(--ink);
    background:var(--white);border:5px solid var(--white);border-radius:32px;
    box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s ease;
  }
  .btn:active{transform:scale(.92) rotate(-2deg);}

  .corner-btn{
    position:absolute;top:12px;font-size:7vmin;line-height:1;
    width:13vmin;height:13vmin;min-width:56px;min-height:56px;
    border-radius:50%;z-index:50;display:flex;align-items:center;justify-content:center;
  }
  .home-btn{left:12px;background:var(--candy-sun);}
  .sound-btn{right:12px;background:var(--candy-mint);}
  #game-audio-toggle[hidden]{display:none;}
  .hold-action{touch-action:none;}
  .hold-action.holding{animation:holdReady 1.1s linear forwards;}
  @keyframes holdReady{
    from{transform:scale(1);box-shadow:var(--shadow)}
    to{transform:scale(.72);box-shadow:0 0 0 12px rgba(255,255,255,.7)}
  }

  /* ---------- HOME ---------- */
  #home{justify-content:flex-start;gap:2vmin;overflow-y:auto;padding:5vmin 3vmin 4vmin;}
  .title{
    font-size:9.5vmin;font-weight:800;text-align:center;line-height:1.05;margin-top:1vmin;
    background:linear-gradient(90deg,#ff5fa8,#ff9d5c,#ffd23f,#5cd68a,#4fb8ff,#a06bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 0 rgba(90,61,122,.15));
    animation:titleBob 3s ease-in-out infinite;
  }
  @keyframes titleBob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-6px)}}
  .subtitle{font-size:4vmin;opacity:.75;margin-bottom:1vmin;}
  .menu{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));justify-content:center;
    gap:2.2vmin;width:min(96vw,1050px);padding:1vmin 0 4vmin;}
  .card{
    width:100%;height:clamp(125px,25vmin,230px);min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vmin;
    animation:cardFloat 3.4s ease-in-out infinite;
  }
  .card:nth-child(2){animation-delay:.4s}.card:nth-child(3){animation-delay:.8s}
  .card:nth-child(4){animation-delay:1.2s}.card:nth-child(5){animation-delay:1.6s}
  @keyframes cardFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
  .card .big{font-size:13vmin;line-height:1;}
  .card .label{font-size:3.4vmin;font-weight:800;}
  .card.c-pop{background:#ffe3f1;}
  .card.c-uni{background:#ecdffd;}
  .card.c-castle{background:#dff0ff;}
  .card.c-letters{background:#e0f9ee;}
  .card.c-leah{background:#fff3d1;}
  .card.c-count{background:#fff0dc;}
  .card.c-memory{background:#e8e4ff;}
  .card.c-math{background:#e1ffe9;}
  .card.c-spell{background:#ffe9fb;}
  .card.c-run{background:#e3f2ff;}
  .card.c-paint{background:#fff6d6;}
  .card.c-colour{background:#ffe4d6;}

  /* ---------- generic game header ---------- */
  .game-title{margin-top:2.5vmin;font-size:5.5vmin;font-weight:800;
    background:var(--white);padding:.6vmin 4vmin;border-radius:40px;box-shadow:var(--shadow);}

  /* ---------- STAR POP ---------- */
  #pop-area{position:relative;flex:1;width:100%;overflow:hidden;}
  .floater{
    position:absolute;bottom:-20vmin;font-size:12vmin;line-height:1;cursor:pointer;z-index:2;
    padding:4vmin; /* generous invisible hit area for little fingers */
    animation:floatUp linear forwards;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(-8deg)}
    50%{transform:translateY(-58vh) rotate(8deg)}
    100%{transform:translateY(-125vh) rotate(-8deg)}
  }
  #rainbow-meter{display:flex;gap:1.6vmin;margin:1.2vmin 0;z-index:5;}
  .meter-dot{width:5vmin;height:5vmin;min-width:26px;min-height:26px;border-radius:50%;
    background:rgba(255,255,255,.55);border:3px solid var(--white);box-shadow:var(--shadow);
    transition:background .3s,transform .3s;}
  .meter-dot.filled{transform:scale(1.2);}

  .flyby{position:fixed;top:30vh;left:-30vw;font-size:16vmin;z-index:90;pointer-events:none;
    animation:flyAcross 3.2s ease-in-out forwards;}
  @keyframes flyAcross{
    0%{transform:translateX(0) rotate(-6deg)}
    50%{transform:translateX(60vw) translateY(-8vh) rotate(6deg)}
    100%{transform:translateX(150vw) rotate(-6deg)}
  }

  /* ---------- particles ---------- */
  .particle{position:absolute;pointer-events:none;font-size:5vmin;line-height:1;z-index:60;
    animation:burst .9s ease-out forwards;}
  @keyframes burst{
    from{transform:translate(0,0) scale(1);opacity:1}
    to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}
  }

  /* ---------- UNICORN DRESS-UP ---------- */
  #uni-stage{
    position:relative;flex:1;width:min(94vw,900px);margin:1vmin 0;border-radius:36px;
    border:6px solid var(--white);box-shadow:var(--shadow);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#bfe3ff 0%,#e6f6ff 60%,#b9ecb4 60%,#8fd98a 100%);
  }
  #uni-stage.bg-rainbow{
    background:
      radial-gradient(circle at 50% 118%, transparent 54%, #ff5fa8 54.5%, #ff5fa8 58%, #ff9d5c 58.5%, #ff9d5c 62%, #ffd23f 62.5%, #ffd23f 66%, #5cd68a 66.5%, #5cd68a 70%, #4fb8ff 70.5%, #4fb8ff 74%, #a06bff 74.5%, #a06bff 78%, transparent 78.5%),
      linear-gradient(180deg,#cfe9ff 0%,#f2fbff 60%,#b9ecb4 60%,#8fd98a 100%);
  }
  #uni-stage.bg-night{
    background:
      radial-gradient(2px 2px at 20% 25%, #fff 60%, transparent 62%),
      radial-gradient(2px 2px at 70% 15%, #fff 60%, transparent 62%),
      radial-gradient(2px 2px at 45% 35%, #fff 60%, transparent 62%),
      radial-gradient(2px 2px at 85% 40%, #fff 60%, transparent 62%),
      radial-gradient(3px 3px at 30% 12%, #ffe9a8 60%, transparent 62%),
      linear-gradient(180deg,#3d2f6b 0%,#6a4d9e 60%,#2e5d4e 60%,#1f4a3c 100%);
  }
  #unicorn-svg{width:min(72vmin,520px);cursor:pointer;filter:drop-shadow(0 10px 6px rgba(90,61,122,.2));}
  #unicorn-svg.bounce{animation:uniBounce .6s ease;}
  @keyframes uniBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-5vmin) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}80%{transform:translateY(-1.5vmin)}}

  #uni-tray{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2vmin;
    padding:1.4vmin 2vmin;margin-bottom:2vmin;background:rgba(255,255,255,.65);
    border-radius:40px;box-shadow:var(--shadow);max-width:94vw;}
  .swatch{width:9vmin;height:9vmin;min-width:44px;min-height:44px;border-radius:50%;
    border:4px solid var(--white);box-shadow:0 4px 0 rgba(90,61,122,.18);cursor:pointer;
    transition:transform .12s;}
  .swatch:active{transform:scale(.88);}
  .swatch.selected{transform:scale(1.18);border-color:var(--candy-sun);}
  .tray-btn{font-size:6vmin;width:11vmin;height:11vmin;min-width:52px;min-height:52px;border-radius:28px;
    display:flex;align-items:center;justify-content:center;}

  /* ---------- CASTLE STICKERS ---------- */
  #castle-scene{
    position:relative;flex:1;width:min(94vw,1000px);margin:1vmin 0;border-radius:36px;
    border:6px solid var(--white);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  }
  #castle-scene svg.bg{position:absolute;inset:0;width:100%;height:100%;}
  .sticker{position:absolute;font-size:12vmin;line-height:1;pointer-events:none;
    transform:translate(-50%,-50%) scale(0) rotate(var(--rot));
    animation:stampIn .35s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes stampIn{to{transform:translate(-50%,-50%) scale(1) rotate(var(--rot));}}
  #sticker-tray{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6vmin;
    padding:1.2vmin 2vmin;margin-bottom:2vmin;background:rgba(255,255,255,.65);
    border-radius:40px;box-shadow:var(--shadow);max-width:94vw;}
  .tray-sticker{font-size:8vmin;line-height:1;width:12vmin;height:12vmin;min-width:54px;min-height:54px;
    border-radius:26px;display:flex;align-items:center;justify-content:center;background:transparent;
    border:4px solid transparent;box-shadow:none;}
  .tray-sticker.selected{background:var(--white);border-color:var(--candy-sun);
    box-shadow:var(--shadow);animation:wiggle .5s ease infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  /* ---------- LETTER BUBBLES ---------- */
  #letter-target{
    font-size:16vmin;font-weight:800;width:26vmin;height:26vmin;min-width:110px;min-height:110px;
    display:flex;align-items:center;justify-content:center;margin-top:1vmin;
    background:var(--white);border-radius:50%;box-shadow:var(--shadow);
    border:6px dashed var(--candy-pink);color:var(--candy-purple);cursor:pointer;
  }
  #letter-name-row{display:flex;gap:1.2vmin;margin-top:1vmin;font-size:5vmin;font-weight:800;}
  #letter-name-row span{width:8vmin;height:8vmin;min-width:38px;min-height:38px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);
    color:rgba(90,61,122,.35);box-shadow:var(--shadow);}
  #letter-name-row span.won{background:var(--candy-sun);color:var(--ink);animation:popWin .4s ease;}
  @keyframes popWin{50%{transform:scale(1.35) rotate(8deg)}}
  #letter-bubbles,#math-answers{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:4vmin;width:100%;padding:2vmin;}
  .bubble{
    font-size:13vmin;font-weight:800;width:24vmin;height:24vmin;min-width:100px;min-height:100px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--white);
    border:6px solid var(--white);box-shadow:var(--shadow);cursor:pointer;
    animation:bubbleFloat 3s ease-in-out infinite;
  }
  .bubble:nth-child(2){animation-delay:.5s}.bubble:nth-child(3){animation-delay:1s}
  .bubble:nth-child(4){animation-delay:1.5s}
  @keyframes bubbleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5vmin)}}
  .bubble.wrong{animation:wobble .5s ease;}
  @keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-2vmin) rotate(-5deg)}
    75%{transform:translateX(2vmin) rotate(5deg)}}

  /* ---------- NUMBER MAGIC ---------- */
  #math-groups{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2.5vmin;
    background:rgba(255,255,255,.65);border-radius:32px;box-shadow:var(--shadow);
    padding:1.6vmin 3.5vmin;max-width:94vw;margin-top:.5vmin;}
  .math-group{display:flex;flex-wrap:wrap;justify-content:center;gap:.8vmin;font-size:7vmin;line-height:1;
    max-width:38vw;}
  .math-op{font-size:6.5vmin;font-weight:800;color:#f06c8d;}
  #math-eq{font-size:7vmin;font-weight:800;margin-top:1.4vmin;background:var(--white);
    padding:.4vmin 5vmin;border-radius:40px;box-shadow:var(--shadow);color:var(--candy-purple);}

  /* ---------- SPELLING BEE ---------- */
  #spell-picture{font-size:16vmin;line-height:1;margin-top:1.5vmin;cursor:pointer;
    filter:drop-shadow(0 6px 3px rgba(90,61,122,.2));animation:cardFloat 3.2s ease-in-out infinite;}
  #spell-slots{display:flex;gap:1.4vmin;margin-top:1.5vmin;font-size:6.5vmin;font-weight:800;}
  #spell-slots span{width:11vmin;height:11vmin;min-width:48px;min-height:48px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);
    color:rgba(90,61,122,.3);border:4px dashed rgba(90,61,122,.25);box-shadow:var(--shadow);}
  #spell-slots span.won{background:var(--candy-sun);color:var(--ink);border:4px solid var(--white);
    animation:popWin .4s ease;}
  #spell-tray{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:3vmin;width:100%;padding:2vmin;}
  .spell-tile{font-size:9vmin;font-weight:800;width:16vmin;height:16vmin;min-width:72px;min-height:72px;
    border-radius:26px;display:flex;align-items:center;justify-content:center;color:var(--white);
    border:5px solid var(--white);box-shadow:var(--shadow);cursor:pointer;transition:opacity .3s,transform .3s;}
  .spell-tile.used{opacity:.25;filter:grayscale(1);pointer-events:none;transform:scale(.82);}
  .spell-tile.wrong{animation:wobble .5s ease;}

  /* ---------- LEAH MODE ---------- */
  #leah-area{position:relative;flex:1;width:100%;cursor:pointer;}
  #leah-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22vmin;pointer-events:none;animation:hintPulse 1.6s ease-in-out infinite;opacity:.8;}
  @keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .friend{position:absolute;font-size:14vmin;line-height:1;pointer-events:none;
    transform:translate(-50%,-50%);animation:friendBounce 1.6s ease forwards;}
  @keyframes friendBounce{
    0%{transform:translate(-50%,-50%) scale(0)}
    30%{transform:translate(-50%,-70%) scale(1.2)}
    55%{transform:translate(-50%,-50%) scale(1)}
    75%{transform:translate(-50%,-60%) scale(1.05)}
    100%{transform:translate(-50%,-50%) scale(0);opacity:0}
  }

  /* ---------- COUNTING GARDEN ---------- */
  #count-prompt{display:flex;align-items:center;justify-content:center;gap:2vmin;margin:1vmin 0;
    min-height:13vmin;font-size:7vmin;font-weight:800;}
  #count-number{width:12vmin;height:12vmin;min-width:62px;min-height:62px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:var(--white);
    border:5px dashed var(--candy-peach);box-shadow:var(--shadow);color:#f06c8d;}
  #count-progress{display:flex;gap:1vmin;min-width:32vmin;justify-content:center;}
  .count-pip{font-size:5.5vmin;filter:grayscale(1);opacity:.28;transition:.2s ease;}
  .count-pip.done{filter:none;opacity:1;transform:scale(1.2);}
  #count-garden{position:relative;flex:1;width:min(95vw,1000px);margin:0 0 2vmin;
    border:6px solid var(--white);border-radius:36px;box-shadow:var(--shadow);overflow:hidden;
    background:linear-gradient(#bfe7ff 0 58%,#b9ecb4 58% 78%,#83d67b 78%);}
  #count-garden::before{content:'☁️\00a0\00a0\00a0☀️';position:absolute;inset:4% 6% auto;
    font-size:9vmin;letter-spacing:12vmin;opacity:.85;pointer-events:none;}
  .count-item{position:absolute;width:17vmin;height:17vmin;min-width:78px;min-height:78px;
    display:flex;align-items:center;justify-content:center;font-size:11vmin;line-height:1;
    border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 5px 2px rgba(90,61,122,.18));
    animation:countBob 2.2s ease-in-out infinite;}
  @keyframes countBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-1.8vmin) rotate(4deg)}}
  .count-item.collected{animation:collectItem .45s ease forwards;pointer-events:none;}
  @keyframes collectItem{to{transform:translateY(-6vmin) scale(0) rotate(20deg);opacity:0}}

  /* ---------- MEMORY MEADOW ---------- */
  #memory-status,#math-status{display:flex;align-items:center;justify-content:center;gap:1.2vmin;
    min-height:9vmin;font-size:5vmin;font-weight:800;margin:.8vmin 0;}
  .memory-star{opacity:.25;filter:grayscale(1);transition:.25s ease;}
  .memory-star.won{opacity:1;filter:none;transform:scale(1.18);}
  #memory-grid{position:relative;flex:1;width:min(92vw,760px);display:grid;grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(2,minmax(105px,1fr));gap:2vmin;min-height:0;margin:0 0 3vmin;}
  .memory-card{position:relative;border:0;border-radius:28px;background:transparent;
    cursor:pointer;perspective:700px;min-width:0;min-height:0;font-family:var(--font);}
  .memory-card-inner{position:absolute;inset:0;perspective:700px;}
  .memory-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border:5px solid var(--white);border-radius:28px;box-shadow:0 7px 0 rgba(90,61,122,.16);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    transition:transform .42s cubic-bezier(.2,.75,.25,1);}
  .memory-back{background:linear-gradient(145deg,#b98fff,#7fc4ff);font-size:9vmin;color:white;
    transform:rotateY(0);}
  .memory-front{background:var(--white);font-size:10vmin;transform:rotateY(-180deg);}
  .memory-card.open .memory-back,.memory-card.matched .memory-back{transform:rotateY(180deg);}
  .memory-card.open .memory-front,.memory-card.matched .memory-front{transform:rotateY(0);}
  .memory-card.matched .memory-front{background:#fff3b7;animation:matchedGlow .7s ease;}
  @keyframes matchedGlow{50%{transform:rotateY(0) scale(1.08)}}

  .celebrate-banner{position:fixed;top:38vh;left:0;right:0;text-align:center;z-index:95;
    font-size:12vmin;font-weight:800;pointer-events:none;
    background:linear-gradient(90deg,#ff5fa8,#ffd23f,#4fb8ff,#a06bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #fff);animation:bannerIn 2.6s ease forwards;}
  @keyframes bannerIn{0%{transform:scale(0)}20%{transform:scale(1.15)}30%{transform:scale(1)}
    80%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}


  /* ---------- RAINBOW RUN (one-tap platformer) ---------- */
  #run-wrap{position:relative;flex:1;width:100%;overflow:hidden;cursor:pointer;touch-action:none;
    border-top:6px solid var(--white);}
  #run-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #run-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20vmin;pointer-events:none;animation:hintPulse 1.4s ease-in-out infinite;opacity:.9;
    filter:drop-shadow(0 4px 0 #fff);}
  #run-meter{display:flex;gap:1.6vmin;margin:1.2vmin 0;z-index:5;}

  /* ---------- PAINT PAD ---------- */
  #paint-wrap{position:relative;flex:1;width:min(94vw,1000px);margin:1vmin 0;border-radius:36px;
    border:6px solid var(--white);box-shadow:var(--shadow);overflow:hidden;background:#fffdfa;
    cursor:crosshair;touch-action:none;}
  #paint-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #paint-tray{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1.6vmin;
    padding:1.2vmin 2vmin;margin-bottom:2vmin;background:rgba(255,255,255,.65);
    border-radius:40px;box-shadow:var(--shadow);max-width:94vw;}
  #paint-tray .swatch.selected{border-color:var(--ink);}
  .paint-tool.selected{background:var(--candy-sun);animation:wiggle .5s ease infinite;}
  .swatch.rainbow{background:conic-gradient(#ff5fa8,#ff9d5c,#ffd23f,#5cd68a,#4fb8ff,#a06bff,#ff5fa8);}

  /* ---------- COLOUR HUNT ---------- */
  #colour-target{width:22vmin;height:22vmin;min-width:96px;min-height:96px;border-radius:50%;
    margin-top:1.5vmin;border:6px solid var(--white);box-shadow:var(--shadow);cursor:pointer;
    animation:cardFloat 3s ease-in-out infinite;}
  #colour-bubbles{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:4vmin;width:100%;padding:2vmin;}
  .colour-bubble{background:var(--white);font-size:14vmin;line-height:1;}
  @media (max-width:760px){
    #home{padding-top:72px;}
    .menu{grid-template-columns:repeat(2,minmax(125px,1fr));gap:14px;}
    .card{height:132px;animation:none;}
    .card .big{font-size:58px}.card .label{font-size:18px}
    .title{font-size:clamp(42px,11vmin,68px)}.subtitle{font-size:clamp(18px,4.5vmin,28px)}
    #memory-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(82px,1fr));}
    .memory-front{font-size:12vmin}.memory-back{font-size:10vmin}
  }
  @media (max-height:600px) and (orientation:landscape){
    #home{padding-top:2vmin}.title{font-size:8vmin}.subtitle{display:none}
    .menu{grid-template-columns:repeat(4,1fr);gap:1.5vmin}.card{height:30vmin;min-height:100px}
    .card .big{font-size:12vmin}.card .label{font-size:3.3vmin}
    .game-title{font-size:4.5vmin}.corner-btn{top:6px}
    #memory-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);}
    #run .game-title{display:none}#run-meter{position:absolute;top:14px;left:50%;transform:translateX(-50%);margin:0;z-index:51}
    #run-wrap{border-top:0}
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,.twinkle,.title,.card,.bubble,.count-item,#spell-picture,#colour-target,#run-hint{animation:none!important;}
    .particle,.flyby,.friend,.celebrate-banner,.sticker,#unicorn-svg.bounce{
      animation-duration:.01ms!important;animation-iteration-count:1!important;}
    .memory-face,.swatch,.meter-dot{transition-duration:.01ms!important;}
  }
</style>
</head>

<script>
'use strict';
/* =====================================================
   Magic Kingdom — a game for two little sisters
   (5 and 2).
   Everything is offline-friendly: no images, no audio
   files — art is emoji + SVG, sound is WebAudio synth.
   ===================================================== */

/* ---------------- sound engine ---------------- */
function storeGet(key, fallback=null){
  try{ const value = localStorage.getItem(key); return value === null ? fallback : value; }
  catch(e){ return fallback; }
}
function storeSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){}
}
function readJSON(key, fallback){
  try{ return JSON.parse(storeGet(key, '')) || fallback; }
  catch(e){ return fallback; }
}
let soundOn = storeGet('mk-sound') !== 'off';
let AC = null;
function ctx(){
  if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur=0.18, type='sine', vol=0.18, delay=0){
  if(!soundOn) return;
  try{
    const ac = ctx(), t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
let noteStep = 0;
function popNote(){ tone(PENTA[noteStep % PENTA.length], 0.2, 'triangle', 0.2); noteStep++; }
function twinkleSound(){ [0,1,2].forEach(i => tone(PENTA[3+i], 0.15, 'sine', 0.12, i*0.07)); }
function boing(){ tone(200, 0.25, 'sine', 0.15); tone(150, 0.3, 'sine', 0.1, 0.08); }
function fanfare(){
  [523.25, 659.25, 783.99, 1046.5, 1046.5].forEach((f,i)=> tone(f, 0.3, 'triangle', 0.2, i*0.16));
  [261.6, 329.6, 392, 523.25, 523.25].forEach((f,i)=> tone(f, 0.3, 'sine', 0.12, i*0.16));
}
function chime(){ const f = PENTA[Math.floor(Math.random()*PENTA.length)]; tone(f, 0.4, 'sine', 0.16); tone(f*2, 0.3, 'sine', 0.06, 0.05); }

/* speech — gentle spoken prompts so no reading is needed */
let voice = null;
const speechTimers = new Set();
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('en'));
  voice = vs.find(v => /karen|samantha|female|zira|catherine/i.test(v.name)) || vs[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(text, delay=0){
  if(!soundOn || !('speechSynthesis' in window)) return;
  const timer = setTimeout(()=>{
    speechTimers.delete(timer);
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(voice) u.voice = voice;
      u.rate = 0.92; u.pitch = 1.25;
      speechSynthesis.speak(u);
    }catch(e){}
  }, delay);
  speechTimers.add(timer);
}
function stopSpeech(){
  speechTimers.forEach(clearTimeout);
  speechTimers.clear();
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

const soundBtn = document.getElementById('sound-toggle');
const gameAudioBtn = document.getElementById('game-audio-toggle');
let replayPrompt = '';
let gameAudioHoldTimer = null;
let gameAudioHeld = false;
function sayPrompt(text, delay=0){
  replayPrompt = text;
  say(text, delay);
}
function renderSoundBtn(){
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundBtn.setAttribute('aria-label', soundOn ? 'turn sound off' : 'turn sound on');
  gameAudioBtn.textContent = soundOn ? '🔊' : '🔇';
  gameAudioBtn.setAttribute('aria-pressed', String(soundOn));
  gameAudioBtn.setAttribute('aria-label', soundOn
    ? 'hear instructions again; hold to mute'
    : 'turn sound on and hear instructions');
}
function setSound(on){
  soundOn = on;
  storeSet('mk-sound', soundOn ? 'on' : 'off');
  if(!soundOn) stopSpeech();
  renderSoundBtn();
  if(soundOn) twinkleSound();
}
function cancelGameAudioHold(){
  clearTimeout(gameAudioHoldTimer);
  gameAudioHoldTimer = null;
  gameAudioBtn.classList.remove('holding');
}
renderSoundBtn();
soundBtn.addEventListener('pointerdown', () => {
  setSound(!soundOn);
});
gameAudioBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  e.preventDefault();
  if(gameAudioHoldTimer) return;
  gameAudioHeld = false;
  gameAudioBtn.classList.add('holding');
  try{ gameAudioBtn.setPointerCapture(e.pointerId); }catch(err){}
  gameAudioHoldTimer = setTimeout(()=>{
    gameAudioHeld = true;
    gameAudioHoldTimer = null;
    gameAudioBtn.classList.remove('holding');
    setSound(!soundOn);
  }, 1100);
});
gameAudioBtn.addEventListener('pointerup', e => {
  e.stopPropagation();
  const wasHeld = gameAudioHeld;
  cancelGameAudioHold();
  if(wasHeld) return;
  if(!soundOn) setSound(true);
  if(replayPrompt) say(replayPrompt);
});
gameAudioBtn.addEventListener('pointercancel', cancelGameAudioHold);
gameAudioBtn.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- particles & celebration ---------------- */
function burst(x, y, container, emojis=['✨','⭐','💖','🌟'], count=10){
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const ang = Math.random()*Math.PI*2, dist = 8 + Math.random()*16;
    p.style.setProperty('--dx', Math.cos(ang)*dist + 'vmin');
    p.style.setProperty('--dy', Math.sin(ang)*dist + 'vmin');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newLetterRound(){
  letterLocked = false;
  const word = ROUNDS[roundIdx].word;
  const target = word[letterIdx];
  targetEl.textContent = target;
  renderNameRow();
  const distractors = shuffle(ALPHABET.split('').filter(c => c !== target)).slice(0,3);
  const options = shuffle([target, ...distractors]);

  memoryGrid.innerHTML = '';

/* =====================================================
   GAME 7 — NUMBER MAGIC
   Gentle addition: count the two emoji groups, then
   tap the answer bubble. Sums grow slowly, max 10.
   ===================================================== */
const mathStatus = document.getElementById('math-status');
const mathGroups = document.getElementById('math-groups');
const mathEq = document.getElementById('math-eq');
const mathAnswers = document.getElementById('math-answers');
const MATH_EMOJI = [
  {emoji:'🍓', name:'strawberries'}, {emoji:'🌟', name:'stars'},
  {emoji:'🧁', name:'cupcakes'},    {emoji:'🦋', name:'butterflies'},
  {emoji:'🌸', name:'flowers'},     {emoji:'🐥', name:'chicks'},
  {emoji:'🍎', name:'apples'},      {emoji:'💎', name:'jewels'},
];
let mathRound = 0, mathStars = 0, mathLocked = false, mathTimer = null;
function renderMathStars(){
  mathStatus.innerHTML = '<span>✨</span>';
  for(let i=0;i<5;i++){
    const star = document.createElement('span');
    star.className = 'memory-star' + (i < mathStars ? ' won' : '');
    star.textContent = '⭐';
    mathStatus.appendChild(star);
  }
  const end = document.createElement('span'); end.textContent = '✨'; mathStatus.appendChild(end);
}
function newMathRound(){
  mathLocked = false;
  const maxAddend = Math.min(5, 2 + Math.floor(mathRound / 3));
  const a = 1 + Math.floor(Math.random()*maxAddend);
  const b = 1 + Math.floor(Math.random()*maxAddend);
  const sum = a + b;
  const friend = MATH_EMOJI[mathRound % MATH_EMOJI.length];
  const emoji = friend.emoji;
  mathRound++;
  mathGroups.innerHTML = '';
  const groupA = document.createElement('div'); groupA.className = 'math-group';
  groupA.textContent = emoji.repeat(a);
  const op = document.createElement('div'); op.className = 'math-op'; op.textContent = '+';
  const groupB = document.createElement('div'); groupB.className = 'math-group';
  groupB.textContent = emoji.repeat(b);
  mathGroups.append(groupA, op, groupB);
  mathEq.textContent = a + ' + ' + b + ' = ?';
  const distractors = shuffle([sum-2, sum-1, sum+1, sum+2].filter(n => n >= 1 && n !== sum)).slice(0,2);
  const options = shuffle([sum, ...distractors]);
  mathAnswers.innerHTML = '';
  options.forEach((n,i)=>{
    const bub = document.createElement('button');
    bub.className = 'btn bubble';
    bub.textContent = n;
    bub.style.background = BUBBLE_COLORS[i];
    bub.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      if(mathLocked) return;
      if(n === sum){
        mathLocked = true;
        mathEq.textContent = a + ' + ' + b + ' = ' + sum;
        const r = mathAnswers.getBoundingClientRect();
        burst(e.clientX - r.left, e.clientY - r.top, mathAnswers, ['⭐','✨','💖']);
        mathStars++;
        renderMathStars();
        if(mathStars >= 5){
          fanfare(); unicornFlyby(); banner('SUPER!');
          say('Yes! ' + a + ' plus ' + b + ' makes ' + sum + '. You are a number star!', 300);
          mathTimer = setTimeout(()=>{ mathStars = 0; renderMathStars(); newMathRound(); }, 3200);
        }else{
          twinkleSound();
          say('Yes! ' + a + ' plus ' + b + ' makes ' + sum + '!');
          mathTimer = setTimeout(newMathRound, 2300);
        }
      }else{

const spellSlots = document.getElementById('spell-slots');

const SPELL_WORDS = [

  {word:'BEE', emoji:'🐝'}, {word:'PIG', emoji:'🐷'}, {word:'HAT', emoji:'👒'},
  {word:'STAR', emoji:'⭐'}, {word:'MOON', emoji:'🌙'}, {word:'FISH', emoji:'🐠'},
  {word:'FROG', emoji:'🐸'}, {word:'CAKE', emoji:'🎂'},

let spellIdx = 0, spellPos = 0, spellLocked = false, spellTimer = null;
function renderSpellSlots(word){
  spellSlots.innerHTML = '';

/* hold-to-activate helper for buttons that should not fire on an accidental tap */
function holdButton(btn, onHold, ms=1100){
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault();
    if(timer) return;
    btn.classList.add('holding');
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    timer = setTimeout(()=>{ timer = null; btn.classList.remove('holding'); onHold(); }, ms);
  });
  btn.addEventListener('pointerup', e => { e.stopPropagation(); cancel(); });
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* =====================================================
   GAME 10 — RAINBOW RUN (one-tap platformer)
   The unicorn runs by herself. Tap anywhere to jump;
   a second tap in the air gives a second jump. Falling
   off the edge just summons a cloud that floats her back
   onto the path — there is no way to lose. Reaching the
   castle finishes the level; the next one is a touch
   faster with slightly wider gaps.
   World units: 1 unit = 1/11 of the play area height,
   x grows to the right, y grows downward.
   ===================================================== */
const runWrap = document.getElementById('run-wrap');
const runCanvas = document.getElementById('run-canvas');
const runCtx = runCanvas.getContext('2d');
const runHint = document.getElementById('run-hint');
const runMeter = document.getElementById('run-meter');
RAINBOW.forEach(()=>{ const d = document.createElement('div'); d.className = 'meter-dot'; runMeter.appendChild(d); });
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const RUN_G = 38, RUN_JUMP = 16, RUN_JUMP2 = 15;
const HERO_W = 1.0, HERO_H = 1.3;
const RUN = {
  level: 1, stars: 0, raf: null, last: 0, W: 0, H: 0, u: 40, yOff: 0, dpr: 1, t: 0,
  cam: 0, speed: 5, state: 'run', ground: [], plats: [], items: [], snails: [], parts: [], puffs: [],
  genX: 0, goalX: 0, castleX: 0, done: false, winTimer: null, hintTimer: null, stuckT: 0,
  hero: { x: 2, feet: 8, vy: 0, onGround: false, jumps: 0, coyote: 0, buffer: 0, squash: 1 },
};
function renderRunMeter(){
  [...runMeter.children].forEach((d,i)=>{
    const on = i < RUN.stars;
    d.classList.toggle('filled', on);
    d.style.background = on ? RAINBOW[i] : '';
  });
}
function runResize(){
  RUN.W = runWrap.clientWidth; RUN.H = runWrap.clientHeight;
  RUN.dpr = Math.min(2, window.devicePixelRatio || 1);
  runCanvas.width = Math.max(1, Math.round(RUN.W * RUN.dpr));
  runCanvas.height = Math.max(1, Math.round(RUN.H * RUN.dpr));
  runCtx.setTransform(RUN.dpr, 0, 0, RUN.dpr, 0, 0);
  RUN.u = Math.max(20, Math.min(RUN.H / 11, RUN.W / 10));
  RUN.yOff = RUN.H - RUN.u * 11;
}
function lastGround(){ return RUN.ground[RUN.ground.length - 1]; }
function runItem(x, y, e){ RUN.items.push({ x, y, e, got: 0, phase: Math.random()*6.28 }); }
function pickItem(){ const r = Math.random(); return r < .72 ? '⭐' : r < .9 ? '💖' : '🌈'; }
function genSegment(){
  const L = RUN.level, prev = lastGround();
  let gap = 0;
  if(RUN.genX > 12 && Math.random() < Math.min(.72, .42 + L*.06)){
    gap = 1.6 + Math.random() * Math.min(2.4, .6 + L*.45);
  }
  let top = prev.top;
  if(gap){ top += [ -1.5, -1, 0, 0, 1 ][Math.floor(Math.random()*5)]; }          // rise only after a gap
  else if(Math.random() < .3){ top += 1; }                                         // gentle step down
  top = Math.min(9.5, Math.max(6.5, top));
  const x = RUN.genX + gap;
  const w = 4 + Math.random() * 6;
  RUN.ground.push({ x, w, top });
  if(gap){                                                                         // arc of stars over the gap
    const base = Math.min(prev.top, top);
    for(let i = 0; i < 3; i++){
      runItem(RUN.genX + gap/2 + (i - 1)*1.2, base - 1.6 - (i === 1 ? 1.2 : .5), i === 1 ? pickItem() : '⭐');
    }
  }else{
    const n = 2 + Math.floor(Math.random()*3);
    const start = x + (w - (n-1)*1.3) / 2;
    const lift = Math.random() < .45 ? 1.6 : 2.6;
    for(let i = 0; i < n; i++) runItem(start + i*1.3, top - lift, pickItem());
  }
  if(w >= 6 && Math.random() < .45){                                               // floating platform
    const pw = 2.5 + Math.random()*1.5, px = x + 1 + Math.random()*(w - pw - 2), py = top - 3.1;
    RUN.plats.push({ x: px, w: pw, top: py });
    runItem(px + pw*.3, py - 1.4, '⭐'); runItem(px + pw*.7, py - 1.4, pickItem());
  }else if(w >= 6 && L >= 2 && Math.random() < .35){                               // friendly snail
    RUN.snails.push({ x: x + w/2, top, dir: 1, t: 0, spin: 0, minX: x + 1, maxX: x + w - 1 });
  }
  RUN.genX = x + w;
}
function genCastle(){
  const prev = lastGround();
  const x = RUN.genX, w = 22;
  RUN.ground.push({ x, w, top: prev.top });
  RUN.castleX = x + 9;
  RUN.done = true;
}
function newLevel(){
  const L = RUN.level;
  RUN.speed = Math.min(8, 4.8 + (L-1)*.45);
  RUN.ground = [{ x: -10, w: 24, top: 8.5 }];
  RUN.plats = []; RUN.items = []; RUN.snails = []; RUN.parts = []; RUN.puffs = [];
  RUN.genX = 14; RUN.goalX = Math.min(220, 80 + L*22); RUN.done = false;
  RUN.state = 'run'; RUN.stuckT = 0;
  Object.assign(RUN.hero, { x: 2, feet: 8.5, vy: 0, onGround: true, jumps: 0, coyote: 0, buffer: 0, squash: 1 });
  RUN.cam = RUN.hero.x - (RUN.W/RUN.u)*.3;
  while(!RUN.done){ if(RUN.genX >= RUN.goalX) genCastle(); else genSegment(); }
}
function runJump(){
  const h = RUN.hero;
  if(RUN.state !== 'run') return;
  runHint.style.display = 'none';
  if(h.onGround || h.coyote > 0){
    h.vy = -RUN_JUMP; h.onGround = false; h.coyote = 0; h.jumps = 1; h.squash = 1.25;
    tone(440, .12, 'triangle', .12); tone(660, .12, 'triangle', .1, .05);
  }else if(h.jumps < 2){
    h.vy = -RUN_JUMP2; h.jumps = 2; h.squash = 1.25;
    RUN.puffs.push({ x: h.x, y: h.feet, t: 0 });
    tone(660, .12, 'triangle', .12); tone(880, .12, 'triangle', .1, .05);
  }else{
    h.buffer = .18;
  }
}
function runSparkle(x, y, n, emojis){
  for(let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, s = 2 + Math.random()*4;
    RUN.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, t: 0, life: .7 + Math.random()*.4,
      e: emojis ? emojis[Math.floor(Math.random()*emojis.length)] : null,
      c: RAINBOW[Math.floor(Math.random()*RAINBOW.length)] });
  }
}
function runRescue(){
  const h = RUN.hero;
  const next = RUN.ground.find(g => g.x + g.w > h.x + 1) || lastGround();
  h.x = Math.max(h.x, next.x + 1.2);
  h.feet = -2; h.vy = 0; h.jumps = 0; h.onGround = false;
  RUN.state = 'rescue';
  boing();
  say('Whoops! Up we go!');
}
function runWin(){
  RUN.state = 'win';
  fanfare(); unicornFlyby(); banner('YAY!');
  runSparkle(RUN.hero.x, RUN.hero.feet - 1, 26, ['⭐','✨','💖','🌈']);
  say('Hooray Myla! You reached the castle! Ready for the next one?', 400);
  RUN.winTimer = setTimeout(()=>{ RUN.level++; newLevel(); sayPrompt('Tap to jump!'); }, 3600);
}
function runStep(dt){
  const h = RUN.hero, W = RUN.W/RUN.u;
  RUN.t += dt;
  const prevFeet = h.feet;
  if(RUN.state === 'run' || RUN.state === 'win'){
    const moving = RUN.state === 'run' || h.x < RUN.castleX + 1.3;
    if(moving) h.x += RUN.speed * dt;
    h.vy += RUN_G * dt;
    h.feet += h.vy * dt;
  }else if(RUN.state === 'rescue'){
    h.feet += 5.5 * dt;
  }
  // landing on ground blocks (with a small automatic step-up) and one-way floating platforms
  const wasOnGround = h.onGround;
  h.onGround = false;
  if(h.vy >= 0 || RUN.state === 'rescue'){
    const solids = RUN.state === 'rescue' ? RUN.ground : RUN.ground.concat(RUN.plats);
    for(const b of solids){
      if(h.x + HERO_W*.3 <= b.x || h.x - HERO_W*.3 >= b.x + b.w) continue;
      const stepUp = RUN.ground.includes(b) ? .6 : 0;
      if(prevFeet <= b.top + .02 + stepUp && h.feet >= b.top - .02){
        h.feet = b.top; h.vy = 0; h.onGround = true;
        if(RUN.state === 'rescue'){ RUN.state = 'run'; runSparkle(h.x, h.feet, 8, ['☁️','✨']); }
        break;
      }
    }
  }
  if(RUN.state === 'run'){
    for(const b of RUN.ground){
      if(h.x + HERO_W*.3 > b.x && h.x - HERO_W*.3 < b.x + b.w && h.feet > b.top + .62 && prevFeet > b.top + .62){
        h.x = Math.min(h.x, b.x - HERO_W*.3);
      }
    }
  }
  if(h.onGround){
    if(!wasOnGround){ h.squash = .7; h.jumps = 0; if(h.buffer > 0){ h.buffer = 0; runJump(); } }
    h.jumps = 0; h.coyote = .12;
  }else{
    if(wasOnGround) h.coyote = .12; else h.coyote = Math.max(0, h.coyote - dt);
  }
  h.buffer = Math.max(0, h.buffer - dt);
  h.squash += (1 - h.squash) * Math.min(1, dt*10);
  if(RUN.state === 'run' && h.feet > 11 + 2) runRescue();
  if(RUN.state === 'run' && h.x >= RUN.castleX) runWin();
  // items
  for(const it of RUN.items){
    if(it.got){ it.got += dt; continue; }
    const iy = it.y + Math.sin(RUN.t*3 + it.phase)*.15;
    if(Math.abs(it.x - h.x) < .9 && Math.abs(iy - (h.feet - HERO_H/2)) < 1.1){
      it.got = .001;
      popNote();
      runSparkle(it.x, iy, 6, null);
      RUN.stars++;
      if(RUN.stars >= RAINBOW.length){
        RUN.stars = 0; twinkleSound(); runSparkle(h.x, h.feet - 1, 18, ['🌈','⭐','✨']);
        say(['You made a rainbow!','Sparkly!','Wow, so many stars!'][Math.floor(Math.random()*3)]);
      }
      renderRunMeter();
    }
  }
  // snails: bump = bounce
  for(const s of RUN.snails){
    s.t += dt; s.spin = Math.max(0, s.spin - dt*3);
    s.x += s.dir * .6 * dt;
    if(s.x > s.maxX) s.dir = -1; else if(s.x < s.minX) s.dir = 1;
    if(Math.abs(s.x - h.x) < .9 && h.feet > s.top - 1.2 && h.feet <= s.top + .05 && RUN.state === 'run' && s.spin === 0){
      h.vy = -RUN_JUMP; h.onGround = false; h.jumps = 1; h.squash = 1.3; s.spin = 1;
      tone(330, .15, 'square', .06); tone(520, .2, 'triangle', .12, .06);
      runSparkle(s.x, s.top - .6, 6, ['💕','✨']);
    }
  }
  for(const p of RUN.puffs) p.t += dt;
  RUN.puffs = RUN.puffs.filter(p => p.t < .5);
  for(const p of RUN.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 12*dt; }
  RUN.parts = RUN.parts.filter(p => p.t < p.life);
  RUN.items = RUN.items.filter(it => it.got < .5 && it.x > RUN.cam - 4);
  // camera follows a little ahead of the hero
  const target = Math.min(h.x - W*.3, RUN.castleX + 9 - W);
  RUN.cam += (target - RUN.cam) * Math.min(1, dt*(RUN.state === 'rescue' ? 3 : 7));
  // gentle reminder if she never taps
  if(RUN.state === 'run' && runHint.style.display !== 'none'){
    RUN.stuckT += dt;
    if(RUN.stuckT > 6){ RUN.stuckT = 0; say('Tap the screen to jump!'); }
  }
}
function emoji(ctx, e, x, y, size, flip){
  ctx.save();
  ctx.translate(x, y);
  if(flip) ctx.scale(-1, 1);
  ctx.font = size + 'px ' + EMOJI_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, 0);
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function runDraw(){
  const c = runCtx, u = RUN.u, W = RUN.W, H = RUN.H, cam = RUN.cam, h = RUN.hero;
  const X = x => (x - cam) * u, Y = y => y * u + RUN.yOff;
  // sky
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#bfe3ff'); sky.addColorStop(.6, '#f6e6ff'); sky.addColorStop(1, '#ffe9c9');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  emoji(c, '☀️', W - u*1.4, Math.max(u*1.2, RUN.yOff*.5 + u*.6), u*1.3);
  // parallax clouds & hills
  for(let i = 0; i < 5; i++){
    const cx = ((i*137 - cam*u*.25) % (W + u*6) + W + u*6) % (W + u*6) - u*3;
    emoji(c, '☁️', cx, u*(1 + (i%3)*1.1), u*1.6);
  }
  c.fillStyle = '#c7ecd2';
  c.beginPath(); c.moveTo(0, H);
  for(let px = 0; px <= W; px += 12){
    const wx = px/u + cam*.45;
    c.lineTo(px, Y(8.6) - u*(1.2 + Math.sin(wx*.35)*.9 + Math.sin(wx*.11)*1.2));
  }
  c.lineTo(W, H); c.closePath(); c.fill();
  // rainbow bridge platforms
  for(const p of RUN.plats){
    if(p.x + p.w < cam - 1 || p.x > cam + W/u + 1) continue;
    const x = X(p.x), y = Y(p.top), w = p.w*u;
    const g = c.createLinearGradient(x, 0, x + w, 0);
    RAINBOW.forEach((col, i) => g.addColorStop(i/(RAINBOW.length-1), col));
    c.fillStyle = '#fffdfa'; roundRect(c, x - 3, y - 3, w + 6, u*.6 + 6, u*.3); c.fill();
    c.fillStyle = g; roundRect(c, x, y, w, u*.6, u*.28); c.fill();
  }
  // ground
  for(const b of RUN.ground){
    if(b.x + b.w < cam - 1 || b.x > cam + W/u + 1) continue;
    const x = X(b.x), y = Y(b.top), w = b.w*u;
    c.fillStyle = '#f5b9dc'; roundRect(c, x, y, w, H - y + u, u*.35); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)';
    for(let d = x + u*.6; d < x + w - u*.3; d += u*1.1){ c.beginPath(); c.arc(d, y + u*1.3, u*.14, 0, 7); c.fill(); }
    c.fillStyle = '#86dd7c'; roundRect(c, x, y, w, u*.5, u*.25); c.fill();
    c.fillStyle = '#5cd68a';
    for(let d = x + u*.3; d < x + w - u*.2; d += u*.55){ c.beginPath(); c.arc(d, y + u*.42, u*.12, 0, 7); c.fill(); }
  }
  // castle
  if(RUN.castleX - cam < W/u + 4){
    const top = lastGround().top;
    emoji(c, '🏰', X(RUN.castleX + 1.2), Y(top) - u*1.6, u*3.4);
    emoji(c, '🎈', X(RUN.castleX - .6) , Y(top) - u*3.3 + Math.sin(RUN.t*2)*u*.15, u*1);
    emoji(c, '🎈', X(RUN.castleX + 3.2), Y(top) - u*3.1 + Math.cos(RUN.t*2)*u*.15, u*1);
  }
  // snails
  for(const s of RUN.snails){
    if(s.x < cam - 2 || s.x > cam + W/u + 2) continue;
    c.save(); c.translate(X(s.x), Y(s.top) - u*.5);
    if(s.spin > 0) c.rotate(Math.sin(s.spin*Math.PI)*1.2);
    emoji(c, '🐌', 0, 0, u*1.1, s.dir > 0);
    c.restore();
  }
  // items
  for(const it of RUN.items){
    if(it.x < cam - 1 || it.x > cam + W/u + 1) continue;
    const bob = Math.sin(RUN.t*3 + it.phase)*.15;
    const size = it.got ? Math.max(0, 1 - it.got*2.5) : 1;
    emoji(c, it.e, X(it.x), Y(it.y + bob), u*size*(it.e === '🌈' ? 1.15 : .95));
  }
  // rescue cloud
  if(RUN.state === 'rescue') emoji(c, '☁️', X(h.x), Y(h.feet) + u*.25, u*2.2);
  // double-jump puffs
  for(const p of RUN.puffs){
    c.globalAlpha = 1 - p.t*2;
    emoji(c, '☁️', X(p.x), Y(p.y) + p.t*u, u*(.9 + p.t));
    c.globalAlpha = 1;
  }
  // hero (a unicorn, flipped to run to the right) with squash & stretch
  const sq = h.squash;
  c.save();
  c.translate(X(h.x), Y(h.feet));
  c.rotate(RUN.state === 'run' ? Math.max(-.25, Math.min(.25, h.vy*.018)) : 0);
  c.scale(1/Math.sqrt(sq), sq);
  emoji(c, '🦄', 0, -u*HERO_H*.55, u*1.6, true);
  c.restore();
  // particles
  for(const p of RUN.parts){
    c.globalAlpha = Math.max(0, 1 - p.t/p.life);
    if(p.e){ emoji(c, p.e, X(p.x), Y(p.y), u*.7); }
    else{ c.fillStyle = p.c; c.beginPath(); c.arc(X(p.x), Y(p.y), u*.14, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1;
}
function runFrame(now){
  const dt = Math.min(.05, (now - RUN.last)/1000 || 0);
  RUN.last = now;
  runStep(dt);
  if(RUN.state === 'run' && Math.random() < .5){          // rainbow trail behind the hero
    RUN.parts.push({ x: RUN.hero.x - .5, y: RUN.hero.feet - .5 - Math.random()*.6, vx: -1, vy: 0, t: 0, life: .45,
      e: null, c: RAINBOW[Math.floor(RUN.t*12) % RAINBOW.length] });
  }
  runDraw();
  RUN.raf = requestAnimationFrame(runFrame);
}
runWrap.addEventListener('pointerdown', () => runJump());
document.addEventListener('keydown', e => {
  if(current !== 'run' || e.repeat) return;
  if(e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); runJump(); }
});
window.addEventListener('resize', () => { if(current === 'run') runResize(); });
enterHooks.run = () => {
  runResize();
  RUN.stars = 0; renderRunMeter();
  runHint.style.display = '';
  newLevel();
  sayPrompt('Tap to jump!', 300);
  RUN.last = performance.now();
  RUN.raf = requestAnimationFrame(runFrame);
};
exitHooks.run = () => {
  cancelAnimationFrame(RUN.raf); RUN.raf = null;
  clearTimeout(RUN.winTimer); RUN.winTimer = null;
};

/* =====================================================
   GAME 11 — PAINT PAD (finger painting)
   Big crayon colours, a rainbow crayon, a sparkle stamp
   brush, undo, and a sponge you hold to wipe clean.
   Strokes are stored in canvas-width units so the
   picture survives rotating the phone; saved locally.
   ===================================================== */
const paintWrap = document.getElementById('paint-wrap');
const paintCanvas = document.getElementById('paint-canvas');
const paintCtx = paintCanvas.getContext('2d');
const paintTray = document.getElementById('paint-tray');
const PAINT_COLOURS = ['#ff5fa8','#ff4d4d','#ff9d5c','#ffd23f','#5cd68a','#4fb8ff','#a06bff','#a0663f','#444'];
const SPARKLES = ['⭐','✨','💖','🌟','🦋','🌸'];
let paintStrokes = readJSON('mk-paint', []);
let paintMode = 'color', paintColour = PAINT_COLOURS[0];
const paintActive = new Map();   // pointerId -> stroke in progress
let paintW = 1, paintH = 1;
function paintResize(){
  paintW = paintWrap.clientWidth; paintH = paintWrap.clientHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  paintCanvas.width = Math.max(1, Math.round(paintW*dpr));
  paintCanvas.height = Math.max(1, Math.round(paintH*dpr));
  paintCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintStrokes.forEach(st => { st.len = null; });
  paintRedraw();
}
function brushSize(){ return Math.max(10, paintW*.04); }
function rainbowAt(len){ return 'hsl(' + ((len*360/(paintW*.8)) % 360) + ',95%,62%)'; }
function drawSegment(st, i){
  // draws the piece of stroke `st` that ends at point index i (i=0 draws a dot)
  const c = paintCtx, W = paintW, size = brushSize();
  const [x, y] = st.pts[i].map(v => v*W);
  if(st.mode === 'sparkle'){
    if(i === 0 || st.pts[i][2] !== undefined){
      emoji(c, SPARKLES[st.pts[i][2] || 0], x, y, size*1.9 + (st.pts[i][3] || 0)*size);
    }
    return;
  }
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = size;
  if(i === 0){
    c.fillStyle = st.mode === 'rainbow' ? rainbowAt(0) : st.color;
    c.beginPath(); c.arc(x, y, size/2, 0, 7); c.fill();
    return;
  }
  const [px, py] = st.pts[i-1].map(v => v*W);
  c.strokeStyle = st.mode === 'rainbow' ? rainbowAt(st.len[i]) : st.color;
  c.beginPath(); c.moveTo(px, py); c.lineTo(x, y); c.stroke();
}
function paintRedraw(){
  paintCtx.clearRect(0, 0, paintW, paintH);
  for(const st of paintStrokes){
    if(!st.len) rebuildLen(st);
    for(let i = 0; i < st.pts.length; i++) drawSegment(st, i);
  }
}
function rebuildLen(st){
  st.len = [0];
  for(let i = 1; i < st.pts.length; i++){
    const [ax, ay] = st.pts[i-1], [bx, by] = st.pts[i];
    st.len[i] = st.len[i-1] + Math.hypot((bx-ax)*paintW, (by-ay)*paintW);
  }
}
function paintSave(){
  const keep = paintStrokes.slice(-80).map(st => ({ mode: st.mode, color: st.color, pts: st.pts }));
  storeSet('mk-paint', JSON.stringify(keep));
}
function paintPoint(e){
  const r = paintWrap.getBoundingClientRect();
  return [(e.clientX - r.left)/paintW, (e.clientY - r.top)/paintW];
}
paintWrap.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if(paintActive.size >= 4) return;
  try{ paintWrap.setPointerCapture(e.pointerId); }catch(err){}
  const [x, y] = paintPoint(e);
  const st = { mode: paintMode, color: paintColour, pts: [], len: [0], lastSparkle: 0 };
  if(paintMode === 'sparkle') st.pts.push([x, y, Math.floor(Math.random()*SPARKLES.length), Math.random()]);
  else st.pts.push([x, y]);
  paintStrokes.push(st);
  paintActive.set(e.pointerId, st);
  drawSegment(st, 0);
  popNote();
});
paintWrap.addEventListener('pointermove', e => {
  const st = paintActive.get(e.pointerId);
  if(!st) return;
  const [x, y] = paintPoint(e);
  const [lx, ly] = st.pts[st.pts.length-1];
  const d = Math.hypot((x-lx)*paintW, (y-ly)*paintW);
  if(d < 2) return;
  if(st.mode === 'sparkle'){
    st.lastSparkle += d;
    if(st.lastSparkle < brushSize()*1.4) return;
    st.lastSparkle = 0;
    st.pts.push([x, y, Math.floor(Math.random()*SPARKLES.length), Math.random()]);
  }else{
    st.pts.push([x, y]);
  }
  st.len.push(st.len[st.len.length-1] + d);
  drawSegment(st, st.pts.length-1);
});
function paintEnd(e){
  if(!paintActive.has(e.pointerId)) return;
  paintActive.delete(e.pointerId);
  paintSave();
}
paintWrap.addEventListener('pointerup', paintEnd);
paintWrap.addEventListener('pointercancel', paintEnd);

/* tray: colours, rainbow, sparkle, undo, sponge (hold) */
function selectPaint(mode, colour){
  paintMode = mode; if(colour) paintColour = colour;
  paintTray.querySelectorAll('.swatch,.paint-tool').forEach(el => {
    el.classList.toggle('selected', el.dataset.mode === mode && (mode !== 'color' || el.dataset.colour === colour));
  });
}
PAINT_COLOURS.forEach(col => {
  const s = document.createElement('button');
  s.className = 'swatch'; s.style.background = col;
  s.dataset.mode = 'color'; s.dataset.colour = col;
  s.setAttribute('aria-label', 'crayon');
  s.addEventListener('pointerdown', e => { e.stopPropagation(); selectPaint('color', col); popNote(); });
  paintTray.appendChild(s);
});
const rainbowSwatch = document.createElement('button');
rainbowSwatch.className = 'swatch rainbow'; rainbowSwatch.dataset.mode = 'rainbow';
rainbowSwatch.setAttribute('aria-label', 'rainbow crayon');
rainbowSwatch.addEventListener('pointerdown', e => { e.stopPropagation(); selectPaint('rainbow'); twinkleSound(); });
paintTray.appendChild(rainbowSwatch);
const sparkleTool = document.createElement('button');
sparkleTool.className = 'btn tray-btn paint-tool'; sparkleTool.textContent = '✨'; sparkleTool.dataset.mode = 'sparkle';
sparkleTool.setAttribute('aria-label', 'sparkle stamps');
sparkleTool.addEventListener('pointerdown', e => { e.stopPropagation(); selectPaint('sparkle'); chime(); });
paintTray.appendChild(sparkleTool);
const undoTool = document.createElement('button');
undoTool.className = 'btn tray-btn'; undoTool.textContent = '↩️';
undoTool.setAttribute('aria-label', 'undo last stroke');
undoTool.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if(!paintStrokes.length) return;
  paintStrokes.pop(); paintActive.clear(); paintRedraw(); paintSave(); boing();
});
paintTray.appendChild(undoTool);
const spongeTool = document.createElement('button');
spongeTool.className = 'btn tray-btn hold-action'; spongeTool.textContent = '🧽';
spongeTool.setAttribute('aria-label', 'hold to wipe the picture clean');
paintTray.appendChild(spongeTool);
holdButton(spongeTool, () => {
  paintStrokes = []; paintActive.clear(); paintRedraw(); paintSave();
  twinkleSound(); say('All clean! Paint something new!');
});
window.addEventListener('resize', () => { if(current === 'paint') paintResize(); });
enterHooks.paint = () => {
  selectPaint(paintMode, paintColour);
  paintResize();
  sayPrompt('Pick a colour and paint with your finger!', 300);
};
exitHooks.paint = () => { paintActive.clear(); };

/* =====================================================
   GAME 12 — COLOUR HUNT
   A big coloured blob and the voice say a colour; the
   child finds the picture that is that colour. Wrong
   taps wobble and name their colour instead.
   ===================================================== */
const colourStatus = document.getElementById('colour-status');
const colourTarget = document.getElementById('colour-target');
const colourBubbles = document.getElementById('colour-bubbles');
const COLOURS = [
  { name:'pink',   hex:'#ff8fc8', items:[['🌸','a flower'],['🐷','a pig'],['🎀','a bow'],['🦩','a flamingo']] },
  { name:'red',    hex:'#ff4d4d', items:[['🍓','a strawberry'],['🍎','an apple'],['❤️','a heart'],['🍒','cherries']] },
  { name:'orange', hex:'#ff9d5c', items:[['🍊','an orange'],['🥕','a carrot'],['🎃','a pumpkin'],['🦊','a fox']] },
  { name:'yellow', hex:'#ffd23f', items:[['🍌','a banana'],['🐥','a chick'],['🍋','a lemon'],['🌻','a sunflower']] },
  { name:'green',  hex:'#5cd68a', items:[['🐸','a frog'],['🍀','a clover'],['🥦','broccoli'],['🐢','a turtle']] },
  { name:'blue',   hex:'#4fb8ff', items:[['🐳','a whale'],['🫐','blueberries'],['💙','a heart'],['🧢','a cap']] },
  { name:'purple', hex:'#a06bff', items:[['🍇','grapes'],['🍆','an eggplant'],['💜','a heart'],['🔮','a crystal ball']] },
  { name:'brown',  hex:'#a0663f', items:[['🐻','a bear'],['🍫','chocolate'],['🐴','a horse'],['🥔','a potato']] },
];
let colourRound = 0, colourStars = 0, colourLocked = false, colourTimer = null, colourPromptText = '';
function renderColourStars(){
  colourStatus.innerHTML = '<span>✨</span>';
  for(let i = 0; i < 5; i++){
    const star = document.createElement('span');
    star.className = 'memory-star' + (i < colourStars ? ' won' : '');
    star.textContent = '⭐';
    colourStatus.appendChild(star);
  }
  const end = document.createElement('span'); end.textContent = '✨'; colourStatus.appendChild(end);
}
function newColourRound(){
  colourLocked = false;
  const target = COLOURS[colourRound % COLOURS.length];
  colourRound++;
  colourTarget.style.background = target.hex;
  const pick = list => list[Math.floor(Math.random()*list.length)];
  const answer = pick(target.items);
  const others = shuffle(COLOURS.filter(c => c !== target)).slice(0, 3).map(c => ({ c, it: pick(c.items) }));
  const options = shuffle([{ c: target, it: answer }, ...others]);
  colourBubbles.innerHTML = '';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'btn bubble colour-bubble';
    b.textContent = o.it[0];
    b.setAttribute('aria-label', o.it[1]);
    b.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if(colourLocked) return;
      if(o.c === target){
        colourLocked = true;
        const r = colourBubbles.getBoundingClientRect();
        burst(e.clientX - r.left, e.clientY - r.top, colourBubbles, ['⭐','✨','💖']);
        colourStars++;
        renderColourStars();
        if(colourStars >= 5){
          fanfare(); unicornFlyby(); banner('WOW!');
          say('Yes! ' + o.it[1] + ' is ' + target.name + '! You know all the colours!', 300);
          colourTimer = setTimeout(()=>{ colourStars = 0; renderColourStars(); newColourRound(); }, 3200);
        }else{
          twinkleSound();
          say('Yes! ' + o.it[1] + ' is ' + target.name + '!');
          colourTimer = setTimeout(newColourRound, 1800);
        }
      }else{
        b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        boing();
        say('That is ' + o.it[1] + '. It is ' + o.c.name + '. Find something ' + target.name + '!');
      }
    });
    colourBubbles.appendChild(b);
  });
  colourPromptText = 'Find something ' + target.name + '!';
  sayPrompt(colourPromptText, 300);
}
colourTarget.addEventListener('pointerdown', e => { e.stopPropagation(); say(colourPromptText); });
enterHooks.colour = () => { renderColourStars(); newColourRound(); };
exitHooks.colour = () => {
  clearTimeout(colourTimer);
  if(!colourLocked) colourRound = Math.max(0, colourRound - 1);
  colourLocked = true;
};

/* first-gesture audio unlock */
document.body.addEventListener('pointerdown', ()=>{ if(soundOn) ctx(); }, {once:true});
</script>
